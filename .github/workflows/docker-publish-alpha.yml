name: Publish Alpha Image

# Publishes a rolling pre-release image on every push to alpha, tagged :alpha
# and :alpha-<build>. Each push first bumps changelog.alpha.json's build
# counter and records a changelog entry, committed back to alpha as
# "chore: bump alpha build for <sha>" - that commit re-triggers this workflow,
# but the job guard below skips it since the triggering push already built and
# published using the freshly-written file. This never touches changelog.json
# or the real package version; those only change when alpha is promoted to
# main via "Merge alpha with main". The image is verified the same way
# docker-build-check.yml verifies main's release image before it is pushed.

on:
  push:
    branches: [alpha]

concurrency:
  group: docker-publish-alpha
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Bump alpha build, verify, and publish the alpha image
    if: >-
      github.actor != 'github-actions[bot]' &&
      startsWith(github.event.head_commit.message, 'chore: bump alpha build for ') == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check README consistency
        run: npm run docs:check

      - name: Bump alpha build counter and changelog
        id: alpha
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_MESSAGE: ${{ github.event.head_commit.message }}
          SOURCE_DATE: ${{ github.event.head_commit.timestamp }}
          SOURCE_AUTHOR: ${{ github.event.head_commit.author.name }}
          # A push can carry multiple commits; the push event only exposes head_commit
          # above, so COMMITS_JSON backfills every other commit's details.
          COMMITS_JSON: ${{ toJson(github.event.commits) }}
        run: |
          node scripts/update-alpha-changelog.js
          node scripts/validate-changelog-entry.js alpha
          node -e "const fs=require('fs'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'build=' + require('./changelog.alpha.json').build + '\n')"

      - name: Commit alpha build metadata
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add changelog.alpha.json
          git commit -m "chore: bump alpha build for ${SOURCE_COMMIT::7}"
          git push origin alpha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: plembfin:alpha-check
          build-args: BUILD_CHANNEL=alpha
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same probe as docker-build-check.yml: production dependencies install
      # with --ignore-scripts, so a native module with no usable binary for
      # this platform still builds cleanly and would only fail on first
      # database open.
      - name: Verify native modules load inside the image
        run: |
          docker run --rm --entrypoint node plembfin:alpha-check -e "
            const Database = require('better-sqlite3');
            const sharp = require('sharp');
            const db = new Database(':memory:');
            db.exec('CREATE TABLE probe (value TEXT)');
            db.prepare('INSERT INTO probe VALUES (?)').run('ok');
            const row = db.prepare('SELECT value FROM probe').get();
            db.close();
            if (row.value !== 'ok') throw new Error('better-sqlite3 returned unexpected data');
            sharp({ create: { width: 8, height: 8, channels: 3, background: '#000000' } })
              .webp()
              .toBuffer()
              .then((buffer) => {
                if (!buffer.length) throw new Error('sharp produced an empty image');
                console.log('better-sqlite3', require('better-sqlite3/package.json').version, 'and sharp', sharp.versions.sharp, 'both load in the image');
              })
              .catch((error) => { console.error(error); process.exit(1); });
          "

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker/metadata-action lowercases the image ref; github.repository
      # preserves the owner's account casing (Lasikiewicz/plembfin), which
      # GHCR rejects as an image tag.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=alpha
            type=raw,value=alpha-${{ steps.alpha.outputs.build }}

      - name: Build and push alpha image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILD_CHANNEL=alpha
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Notify Discord releases channel
        env:
          DISCORD_RELEASES_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
        run: node scripts/notify-discord-release.js alpha
